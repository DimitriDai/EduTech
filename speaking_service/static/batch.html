<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Speaking Batch</title>

  <style>
    :root{
      --page-bg:#ffffff;
      --card-bg:#c3d8ff;
      --card-inner:#ffffff;

      --ink:#2165c7;
      --ink-soft:rgba(33,101,199,.78);
      --bd: rgba(33,101,199,.22);

      font-family: system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    body{
      margin: 20px;
      background: var(--page-bg);
      color: #1f2937;
    }

    /* 顶部标题区：不做卡片 */
    .hero{
      margin-bottom: 14px;
    }

    h1{
      margin: 0 0 10px 0;
      font-size: 26px;
      color: var(--ink);
      display:flex;
      align-items:center;
      gap:10px;
      font-weight: 800;
    }

    .muted{ color: var(--ink-soft); font-size: 12px; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    .row{
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items:center;
    }

    .help-row{
      margin-top: 8px;
    }

    .help-link{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(33,101,199,.78);
      text-decoration: none;
    }

    .help-link:hover{
      text-decoration: underline;
    }

    .help-ico{
      display:inline-flex;
      width: 18px;
      height: 18px;
      align-items:center;
      justify-content:center;
      border-radius: 999px;
      border: 1px solid rgba(33,101,199,.25);
      background: rgba(255,255,255,.65);
      line-height: 1;
    }

    /* 卡片：输入/配置/下载都用同一层级 */
    .card{
      background: var(--card-bg);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 14px;
      margin: 12px 0;
      box-shadow: 0 10px 26px rgba(33,101,199,.08);
    }

    /* 卡片内的“白色内衬”，让控件更清爽 */
    .card-inner{
      background: var(--card-inner);
      border: 1px solid rgba(33,101,199,.14);
      border-radius: 12px;
      padding: 12px;
    }

    .card h2{
      margin: 0 0 10px 0;
      font-size: 16px;
      color: var(--ink);
      display:flex;
      align-items:center;
      gap:8px;
      font-weight: 800;
    }

    .ico{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size: 18px;
      line-height: 1;
    }

    label{ display:inline-flex; gap:8px; align-items:center; color:#1f2937; }

    input[type="text"], select{
      padding: 8px 10px;
      border: 1px solid rgba(33,101,199,.25);
      border-radius: 10px;
      background:#fff;
    }

    input[type="file"]{
      max-width: 520px;
    }

    button{
      padding: 10px 14px;
      border: 1px solid rgba(33,101,199,.28);
      background: #ffffff;
      color: var(--ink);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
    }

    #resetBtn{ display:none !important; }

    /* 主按钮更突出 */
    #runBtn{
      background: var(--ink);
      color: #ffffff;
      border-color: rgba(33,101,199,.45);
    }
    #runBtn:disabled, button:disabled{ opacity: .55; cursor: not-allowed; }

    .pill{
      display:inline-block;
      padding:2px 8px;
      border:1px solid rgba(33,101,199,.25);
      border-radius:999px;
      font-size:12px;
      color: var(--ink-soft);
      background: rgba(255,255,255,.6);
    }

    .divider{ height:1px; background: rgba(33,101,199,.20); margin:12px 0; }

    /* 下载链接更像“列表” */
    .links a{
      display:block;
      margin: 6px 0 0 0;
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }
    .links a:hover{ text-decoration: underline; }

    /* 隐藏：状态日志（但 DOM 保留，功能不动） */
    .log-hidden{
      display:none !important;
    }

    /* 隐藏：高级配置（prefix/band/role/style/pageBreak 等） */
    .advanced-hidden{
      display:none !important;
    }
  </style>

<script>
  // Portal cache cleanup: ensure mode C is not disabled by stale flags
  try {
    localStorage.removeItem("enable_export_c");
    localStorage.removeItem("speaking_feature_flags");
    delete window.FEATURE_FLAGS;
  } catch (e) {}
</script>
</head>
<body>
  <div class="hero">
    <h1><span class="ico">🗣️</span><span>Speaking</span></h1>
    <div class="muted">上传截图后，将自动识别并生成可下载的口语题库</div>
  </div>

  <!-- 上传截图 -->
  <div class="card">
    <h2><span class="ico">📷</span><span>上传截图</span></h2>
    <div class="card-inner">

      <!-- 文件选择（第一行） -->
      <div class="row">
        <label>
          选择截图（可多选）
          <input id="files" type="file" multiple accept=".png,.jpg,.jpeg,.webp" />
        </label>
      </div>

      <!-- 查看示例（第二行：取代原“流程...”） -->
      <div class="help-row">
        <a class="help-link"
          href="/static/assets/upload_snapshot_eg/snapshot_requirement.png"
          download="snapshot_requirement.png">
          <span class="help-ico">❓</span>
          <span>查看截图格式示例</span>
        </a>
      </div>

    </div>
  </div>

  <!-- 导出配置 -->
  <div class="card">
    <h2><span class="ico">⚙️</span><span>导出配置</span></h2>
    <div class="card-inner">
      <!-- 仅保留 3 个版式 + merge_all -->
      <div class="row" style="margin-bottom:8px;">
        <label><input type="radio" name="mode" value="A" checked /> 纯问题版</label>
      </div>

      <div class="row" style="margin-bottom:8px;">
        <label><input type="radio" name="mode" value="B" /> 含答案版本一</label>
      </div>

      <div id="bOptions" style="margin-left:20px; display:none;">
        <div class="row">
          <label><input type="radio" name="bShow" value="outline" checked /> 仅 outline</label>
          <label><input type="radio" name="bShow" value="answer" /> 仅 sample answer</label>
          <label><input type="radio" name="bShow" value="both" /> outline + sample answer</label>
        </div>
      </div>

      <script>
      document.querySelectorAll('input[name="mode"]').forEach(radio => {
        radio.addEventListener('change', () => {
          document.getElementById('bOptions').style.display =
            radio.value === 'B' && radio.checked ? 'block' : 'none';
        });
      });
      </script>


      <div class="row" style="margin:12px 0 8px 0;">
        <label id="modeCWrap"><input id="modeC" type="radio" name="mode" value="C" /> 含答案版本二</label>
        <span id="cFlag" class="pill muted" style="display:none;"></span>
      </div>

      <div class="divider"></div>

      <div class="row" style="margin-top:10px;">
        <label class="muted">
          <input id="mergeAll" type="checkbox" />
          需要总文档
        </label>
      </div>

      <!-- 高级配置：不展示，但保留在 DOM（功能不动） -->
      <div class="advanced-hidden">
        <div class="row" style="margin-top:10px;">
          <label>分页
            <select id="pageBreak">
              <option value="part" selected>part</option>
              <option value="segment">segment</option>
              <option value="none">none</option>
            </select>
          </label>

          <label>prefix（OCR 用）
            <input id="prefix" type="text" value="雅思话题" />
          </label>
        </div>

        <div class="row" style="margin-top:10px;">
          <label>band <input id="band" type="text" value="6.5-7" /></label>
          <label>role <input id="role" type="text" value="High School Student (Hangzhou, China)" /></label>
          <label>style <input id="style" type="text" value="Natural & Native" /></label>
        </div>
      </div>

      <!-- Teacher settings：默认不显示；你可用 dev 开关打开 -->
      <details class="teacher-settings advanced-hidden" style="margin-top:10px;">
        <summary class="muted">Teacher settings</summary>

        <div class="row" style="margin-top:8px;">
          <label>
            <input type="checkbox" id="forceRegen" />
            强制重生成（忽略缓存）
          </label>

          <label class="muted">
            <input type="checkbox" id="onlyThisRun" disabled />
            仅本次生效（不写入全局缓存）
          </label>
        </div>

        <div class="muted" style="margin-top:6px; line-height:1.4;">
          勾选“强制重生成”才会重新调用模型；<br/>
          勾选“仅本次生效”不会污染全局答案库。
        </div>
      </details>

      <div class="row" style="margin-top:12px;">
        <button id="runBtn"><span class="ico">🚀</span><span>生成并排版</span></button>

        <!-- Reset 按钮仍保留（JS 会引用），但会用 CSS 隐藏 -->
        <button id="resetBtn" type="button">Reset</button>

        <span id="runHint" class="muted"></span>
        <span class="muted">当前 run_id：<span id="runId" class="mono">-</span></span>
      </div>
    </div>
  </div>

  <!-- 下载 -->
  <div class="card">
    <h2><span class="ico">⬇️</span><span>下载区域</span></h2>
    <div class="card-inner">
      <div id="downloadBox" class="links"></div>
    </div>
  </div>

  <!-- 日志：不展示，但保留元素，JS 仍可写入 -->
  <div class="log-hidden">
    <textarea id="log" readonly></textarea>
  </div>

<script>
  // dev 开关：?dev=1 或 localStorage.speaking_dev=1 才显示 Teacher settings（不解锁其他高级项）
  (function(){
    try{
      const qs = new URLSearchParams(location.search);
      const dev = (qs.get("dev") === "1") || (localStorage.getItem("speaking_dev") === "1");
      if(dev){
        document.querySelectorAll(".teacher-settings").forEach(el=>{
          el.classList.remove("advanced-hidden");
          el.open = false; // 默认不展开
        });
      }
    }catch(e){}
  })();
</script>

<script>
  // =========================
  // 配置：API Base（你现在是 8001）
  // =========================
  const API_BASE = location.origin + "/speaking";
  document.getElementById("apiBaseLabel").textContent = API_BASE;

  // =========================
  // 小工具
  // =========================
  const $ = (id) => document.getElementById(id);
  const logEl = $("log");
  const runHintEl = $("runHint");

  // ✅ 教师设置（缓存控制）
  const forceRegenEl = $("forceRegen");
  const onlyThisRunEl = $("onlyThisRun");

  // 保险：避免元素没渲染导致 null 报错
  if (forceRegenEl && onlyThisRunEl) {
    forceRegenEl.addEventListener("change", () => {
      if (!forceRegenEl.checked) {
        onlyThisRunEl.checked = false;
        onlyThisRunEl.disabled = true;
      } else {
        onlyThisRunEl.disabled = false;
      }
    });
  }

  function logLine(msg, level="INFO") {
    const ts = new Date().toISOString().slice(11,19);
    logEl.value += `${ts} [${level}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setBusy(b) {
    $("runBtn").disabled = b;
    $("resetBtn").disabled = b;
    $("files").disabled = b;

    // ✅ 所有 mode 一视同仁，只跟随 busy 状态
    document.querySelectorAll("input[name='mode']").forEach(r => {
      r.disabled = b;
    });

    document.querySelectorAll("input[name='bShow']").forEach(r => r.disabled = b);
    $("pageBreak").disabled = b;
    $("prefix").disabled = b;
    $("band").disabled = b;
    $("role").disabled = b;
    $("style").disabled = b;
    $("mergeAll").disabled = b;

    // Teacher settings
    if (forceRegenEl) forceRegenEl.disabled = b;
    if (onlyThisRunEl) {
      onlyThisRunEl.disabled = b || !(forceRegenEl && forceRegenEl.checked);
    }
  }

  async function safeJson(resp) {
    const text = await resp.text();
    try { return JSON.parse(text); } catch { return { raw: text }; }
  }

  async function apiJson(path, opts={}) {
    const url = API_BASE + path;
    const resp = await fetch(url, opts);
    const data = await safeJson(resp);
    if (!resp.ok) {
      const detail = (data && (data.detail || data.raw)) ? (data.detail || data.raw) : `HTTP ${resp.status}`;
      throw new Error(`${path} -> ${resp.status}: ${typeof detail === "string" ? detail : JSON.stringify(detail)}`);
    }
    return data;
  }

  async function apiPostJson(path, bodyObj) {
    return apiJson(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(bodyObj || {})
    });
  }

  async function apiPostForm(path, formData) {
    return apiJson(path, { method: "POST", body: formData });
  }

  function getMode() { return document.querySelector("input[name='mode']:checked")?.value || "A"; }
  function getBShow() { return document.querySelector("input[name='bShow']:checked")?.value || "outline"; }

  function refreshBOptions() {
    $("bOptions").style.display = (getMode() === "B") ? "block" : "none";
  }
  document.querySelectorAll("input[name='mode']").forEach(r => r.addEventListener("change", refreshBOptions));
  refreshBOptions();

  function clearDownloads() { $("downloadBox").innerHTML = ""; }

  function renderDownloads(runId, files) {
    clearDownloads();
    if (!files || !Array.isArray(files) || files.length === 0) {
      $("downloadBox").innerHTML = `<div class="muted warn">导出完成，但 files 为空（通常是 segments 为空/没有内容可导出）。</div>`;
      return;
    }
    const wrap = document.createElement("div");
    const title = document.createElement("div");
    title.className = "ok";
    title.textContent = "下载：";
    wrap.appendChild(title);

    files.forEach((fn) => {
      const a = document.createElement("a");
      a.href = `${API_BASE}/speaking/run/download?run_id=${encodeURIComponent(runId)}&filename=${encodeURIComponent(fn)}`;
      a.textContent = fn;
      a.target = "_blank";
      wrap.appendChild(a);
    });

    $("downloadBox").appendChild(wrap);
  }

  function computeShowFlags(mode) {
    if (mode === "A") return { show_outline: false, show_answers: false };
    if (mode === "B") {
      const b = getBShow();
      if (b === "outline") return { show_outline: true, show_answers: false };
      if (b === "answer") return { show_outline: false, show_answers: true };
      return { show_outline: true, show_answers: true };
    }
    return { show_outline: true, show_answers: true };
  }


  // =========================
  // Feature Flag：是否允许 C（前端强制开启版）
  // =========================
  async function loadFrontendConfig() {
    // ✅ 前端强制开启 C：不依赖后端 /speaking/frontend/config
    const enabled = true;

    try {
      // 仍然尝试拉取配置，只做日志，不影响开关
      const cfg = await apiJson("/speaking/frontend/config", { method: "GET" });
      logLine(`frontend/config loaded (ignored): enable_export_c=${!!cfg.enable_export_c}`, "OK");
    } catch (e) {
      logLine(`frontend/config failed (ignored): ${e.message}`, "WARN");
    }

    // ✅ 统一按 enabled=true 走“可用”分支
    $("modeCWrap").dataset.disabled = "0";
    $("modeCWrap").style.opacity = "1";
    $("modeC").disabled = false;
    $("cFlag").style.display = "inline-block";

    logLine(`frontend/config forced: enable_export_c=${enabled}`, "OK");
  }

  // =========================
  // 串联流程
  // =========================
  async function runPipeline() {
    clearDownloads();
    if (runHintEl) runHintEl.textContent = "生成中...";

    const files = $("files").files;
    if (!files || files.length === 0) {
      logLine("请先选择截图文件", "ERR");
      return;
    }

    const mode = getMode();
    // ✅ 前端强制开启 C：不再做 dataset.disabled 的运行时拦截

    const prefix = $("prefix").value.trim() || "batch";
    const page_break = $("pageBreak").value;
    const band = $("band").value.trim() || "6.5-7";
    const role = $("role").value.trim() || "High School Student (Hangzhou, China)";
    const style = $("style").value.trim() || "Natural & Native";
    const merge_all = $("mergeAll").checked;

    // ✅ 教师缓存控制
    const force_regen = !!(forceRegenEl && forceRegenEl.checked);
    const only_for_this_run = !!(onlyThisRunEl && onlyThisRunEl.checked);

    setBusy(true);
    logEl.value = "";
    logLine(`Start pipeline: mode=${mode}, files=${files.length}`, "INFO");

    let runId = null;

    try {
      // 1) init
      logLine("1) init run ...", "INFO");
      const initResp = await apiPostJson("/speaking/run/init", {});
      runId = initResp.run_id || initResp.runId || initResp.id;
      if (!runId) throw new Error("init did not return run_id");
      $("runId").textContent = runId;
      logLine(`   run_id=${runId}`, "OK");

      // 2) upload_images
      logLine("2) upload_images ...", "INFO");
      const fd = new FormData();
      for (const f of files) fd.append("files", f, f.name);
      const upResp = await apiPostForm(`/speaking/run/upload_images?run_id=${encodeURIComponent(runId)}`, fd);
      logLine(`   saved=${upResp.saved ?? "?"}, files=${(upResp.files && upResp.files.length) || "?"}`, "OK");

      // 3) rename
      logLine("3) rename ...", "INFO");
      await apiPostJson(`/speaking/run/rename?run_id=${encodeURIComponent(runId)}`, {});
      logLine("   rename done", "OK");

      // 4) OCR
      logLine("4) stage1 OCR ...", "INFO");
      const ocrBody = {
        run_id: runId,
        prefix,
        merge_all,
        band,
        role,
        style
      };
      await apiPostJson("/speaking/stage1/ocr", ocrBody);
      logLine(`   ocr ok`, "OK");

      // 5) parse
      logLine("5) stage2 parse ...", "INFO");
      await apiPostJson(`/speaking/stage2/parse?run_id=${encodeURIComponent(runId)}`, {});
      logLine(`   parse ok`, "OK");

      // 6) generate
      logLine("6) generate_answers ...", "INFO");
      // ✅ 如果后端 generate 接口支持 body，就走 body（用于传缓存控制）；不支持则后端会 422，你把日志贴我我再对齐
      const genParams = new URLSearchParams({
        run_id: runId,
        force_regen: force_regen ? "true" : "false",
        only_for_this_run: only_for_this_run ? "true" : "false",
      });
      await apiPostJson(
        `/speaking/run/generate_answers?${genParams.toString()}`,
        {} // body 不用传这些开关，传空即可
      );
      logLine(`   generate ok`, "OK");

      // 7) export
      logLine("7) export ...", "INFO");
      const flags = computeShowFlags(mode);

      const exportReq = {
        run_id: runId,
        page_break,
        show_outline: flags.show_outline,
        show_answers: flags.show_answers,
        merge_all: merge_all,
        band: band,
        role: role,
        style: style,

        // ✅ 同样把缓存控制透传（你后端如果忽略也没事；严格校验才会 422）
        force_regen,
        only_for_this_run
      };

      let exportPath = "/speaking/export/docx";
      if (mode === "A") exportPath = "/speaking/export/docx_a";
      if (mode === "C") exportPath = "/speaking/export/docx_c";

      const expResp = await apiPostJson(exportPath, exportReq);
      logLine(`   export ok`, "OK");

      // 8) download links
      renderDownloads(runId, expResp.files || []);
      logLine("Done ✅", "OK");
      if (runHintEl) runHintEl.textContent = "完成：请在“下载”区域获取文件";
    } catch (e) {
      logLine(e.message || String(e), "ERR");
      if (runHintEl) runHintEl.textContent = "失败：请检查输入或稍后重试";
    } finally {
      setBusy(false);
    }
  }

  function resetAll() {
    $("files").value = "";
    $("runId").textContent = "-";
    clearDownloads();
    logEl.value = "";
    document.querySelector("input[name='mode'][value='A']").checked = true;
    document.querySelector("input[name='bShow'][value='outline']").checked = true;
    refreshBOptions();
    if (forceRegenEl) forceRegenEl.checked = false;
    if (onlyThisRunEl) { onlyThisRunEl.checked = false; onlyThisRunEl.disabled = true; }
    logLine("Reset", "INFO");
  }

  $("runBtn").addEventListener("click", runPipeline);
  $("resetBtn").addEventListener("click", resetAll);

  loadFrontendConfig();
</script>
</body>
</html>
