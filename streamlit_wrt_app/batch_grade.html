<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Writing</title>

  <style>
    :root{
      --bg-strong:#ffda6a;
      --bg-soft:#fff7de;
      --ink-strong:#cc7a00;
      --ink-soft:#7e6709;
      --bd: rgba(204,122,0,.22);
      --card:#ffffff;
      --panel-yellow: #fff7de;
    }

    *{ box-sizing:border-box; }

    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
                  Arial, "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #1f2937;
      padding: 22px;
    }

    .app{
      max-width: 1060px;
      margin: 0 auto;
    }

    .hero{
      padding: 14px 16px;
      border: none;          /* 去框线 */
      border-radius: 0;      /* 去卡片感 */
      background: #ffffff;  /* 和页面融在一起 */
    }

    h1{
      margin:0 0 6px 0;
      font-size: 26px;
      letter-spacing: .2px;
      color: #cc7a00;
    }

    .small{
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.45;
    }

    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .panel{
      margin-top: 12px;
      padding: 14px 14px;
      border: 1px solid var(--bd);
      border-radius: 14px;
      background: var(--panel-yellow);
      box-shadow: 0 10px 30px rgba(204,122,0,.10);
    }
  
    .panel-head{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
      font-weight:700;
      color:#4a3b00; /* 或你现在 h1 用的颜色 */
    }

    .panel-head .ico,
    .title-ico{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      line-height:1;
    }
    
    /* 操作区：浅黄层级（只影响第一个 panel） */
    .panel-action{
      border-color: rgba(204,122,0,.25);
      box-shadow: 0 10px 30px rgba(204,122,0,.08);
    }

    /* 结果区：保持绝对白底（你已有 panel-result class） */
    .panel-result{
      background: var(--panel-yellow); /* 统一浅黄色 */
    }


    .row{
      margin: 0;
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:wrap;
    }

    input[type="file"]{
      padding: 8px 10px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: #fff;
      max-width: 420px;
    }

    select, button{
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      font-size: 14px;
    }

    button{
      cursor:pointer;
      background: var(--bg-strong);
      color: var(--ink-strong);
      font-weight: 700;
    }

    button:hover{ filter: brightness(.98); }
    button:disabled{ cursor:not-allowed; opacity:.55; }

    /* 次级按钮（全选/全不选/导出）更克制一点 */
    #selectAll, #selectNone, #exportSelected{
      background: #fff;
      color: var(--ink-soft);
      font-weight: 600;
    }
    #selectAll:hover, #selectNone:hover, #exportSelected:hover{
      background: var(--bg-soft);
    }

    .status{ margin-left: 6px; }

    .toolbar{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--bd);
    }

    .pill{
      border: 1px solid var(--bd);
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--bg-soft);
    }

    table{
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      margin-top: 0;
    }

    th, td{
      border-bottom: 1px solid rgba(204,122,0,.16);
      padding: 10px 10px;
      font-size: 14px;
      vertical-align: top;
    }

    th{
      position: sticky;
      top: 0;
      background: var(--bg-soft);
      color: var(--ink-soft);
      text-align: left;
      font-weight: 700;
      border-top: 1px solid rgba(204,122,0,.16);
    }

    /* 表格圆角（只做视觉） */
    table thead tr th:first-child{ border-top-left-radius: 10px; }
    table thead tr th:last-child{ border-top-right-radius: 10px; }

    .ok{ color: var(--ink-strong); font-weight: 800; }
    .bad{ color: #b00020; font-weight: 800; }

    .right{ text-align:right; }
    .nowrap{ white-space:nowrap; }

    pre{
      background: var(--bg-soft);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 12px;
      overflow:auto;
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="hero">
      <h1><span class="title-ico">✍️</span><span>Writing</span></h1>
      <div class="small">
        说明：先批改生成列表，再勾选导出所选反馈（zip）。
      </div>
    </header>

    <section class="panel panel-action">
      <div class="panel-head">
        <span class="ico">📂</span>
        <span>上传与批改</span>
      </div>
      <div class="row">
        <input id="files" type="file" multiple accept=".txt,.docx,.doc" />
        <select id="taskType">
          <option value="">自动识别 Task</option>
          <option value="Task 1">Task 1</option>
          <option value="Task 2">Task 2</option>
        </select>
        <button id="run">批量批改</button>
        <span id="status" class="small status"></span>
      </div>

      <div class="toolbar">
        <span class="pill small">batch_id: <span id="batchId" class="mono">-</span></span>
        <button id="selectAll" disabled>全选</button>
        <button id="selectNone" disabled>全不选</button>
        <button id="exportSelected" disabled>导出所选报告（zip）</button>
        <span id="selectedCount" class="small"></span>
      </div>
    </section>

    <section class="panel panel-result">
      <div class="panel-head">
        <span class="ico">📄</span>
        <span>批改结果</span>
      </div>
      <div id="result"></div>
    </section>


  </div>

  <script>
    const API_STAGE1 = "/writing/api/grade/files";
    const API_STAGE2 = "/writing/api/grade/report/selected";

    let currentBatchId = null;
    let currentRows = [];   // Stage 1 results: [{file_id, filename, ok, ...}]
    let selectedSet = new Set(); // selected file_ids

    function escapeHtml(s) {
      return (s || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }

    function setButtonsEnabled(enabled) {
      document.getElementById("selectAll").disabled = !enabled;
      document.getElementById("selectNone").disabled = !enabled;
      document.getElementById("exportSelected").disabled = !enabled;
    }

    function updateSelectedCount() {
      const el = document.getElementById("selectedCount");
      const total = currentRows.filter(r => r.ok).length;
      const sel = selectedSet.size;
      el.textContent = total ? `已选 ${sel} / ${total}（仅统计成功条目）` : "";
      document.getElementById("exportSelected").disabled = !(currentBatchId && sel > 0);
    }

    function renderTable() {
      const resultEl = document.getElementById("result");

      if (!currentRows || currentRows.length === 0) {
        resultEl.innerHTML = "";
        setButtonsEnabled(false);
        updateSelectedCount();
        return;
      }

      const hasAnySuccess = currentRows.some(r => r.ok);
      setButtonsEnabled(hasAnySuccess);
      updateSelectedCount();

      const rowsHtml = currentRows.map(item => {
        if (!item.ok) {
          return `
            <tr>
              <td class="nowrap"></td>
              <td>${escapeHtml(item.filename)}</td>
              <td class="bad nowrap">失败</td>
              <td colspan="8">${escapeHtml(item.error || "")}</td>
            </tr>
          `;
        }

        const checked = selectedSet.has(item.file_id) ? "checked" : "";
        return `
          <tr>
            <td class="nowrap">
              <input type="checkbox" class="pick" data-id="${escapeHtml(item.file_id)}" ${checked} />
            </td>
            <td>${escapeHtml(item.filename)}</td>
            <td class="ok nowrap">成功</td>
            <td class="nowrap">${escapeHtml(item.task_type || "")}</td>
            <td class="right">${item.overall ?? ""}</td>
            <td class="right">${item.TR ?? ""}</td>
            <td class="right">${item.CC ?? ""}</td>
            <td class="right">${item.LR ?? ""}</td>
            <td class="right">${item.GRA ?? ""}</td>
            <td class="right">${item.word_count ?? ""}</td>
            <td class="right">${item.paragraph_count ?? ""}</td>
          </tr>
        `;
      }).join("");

      resultEl.innerHTML = `
        <table>
          <thead>
            <tr>
              <th class="nowrap">选择</th>
              <th>文件名</th>
              <th class="nowrap">状态</th>
              <th class="nowrap">Task</th>
              <th class="right nowrap">Overall</th>
              <th class="right nowrap">TR</th>
              <th class="right nowrap">CC</th>
              <th class="right nowrap">LR</th>
              <th class="right nowrap">GRA</th>
              <th class="right nowrap">词数</th>
              <th class="right nowrap">段落</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;

      document.querySelectorAll("input.pick").forEach(cb => {
        cb.addEventListener("change", (e) => {
          const id = e.target.getAttribute("data-id");
          if (!id) return;
          if (e.target.checked) selectedSet.add(id);
          else selectedSet.delete(id);
          updateSelectedCount();
        });
      });

      updateSelectedCount();
    }

    async function downloadZipFromResponse(resp, fallbackName="reports.zip") {
      const blob = await resp.blob();

      let filename = fallbackName;
      const cd = resp.headers.get("content-disposition");
      if (cd) {
        const m = cd.match(/filename="?([^"]+)"?/i);
        if (m && m[1]) filename = m[1];
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    document.getElementById("run").addEventListener("click", async () => {
      const filesEl = document.getElementById("files");
      const taskTypeEl = document.getElementById("taskType");
      const statusEl = document.getElementById("status");
      const batchIdEl = document.getElementById("batchId");

      if (!filesEl.files || filesEl.files.length === 0) {
        alert("请先选择至少一个文件（.txt 或 .docx）");
        return;
      }

      currentBatchId = null;
      currentRows = [];
      selectedSet.clear();
      batchIdEl.textContent = "-";
      renderTable();

      const fd = new FormData();
      for (const f of filesEl.files) fd.append("files", f);

      const taskType = taskTypeEl.value.trim();
      const url = taskType ? `${API_STAGE1}?task_type=${encodeURIComponent(taskType)}` : API_STAGE1;

      statusEl.textContent = "正在批改中…";
      document.getElementById("run").disabled = true;
      setButtonsEnabled(false);

      try {
        const resp = await fetch(url, { method: "POST", body: fd });
        const data = await resp.json();

        if (!resp.ok) {
          statusEl.textContent = `请求失败：HTTP ${resp.status}`;
          document.getElementById("result").innerHTML = `<pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
          return;
        }

        currentBatchId = data.batch_id;
        currentRows = data.results || [];
        batchIdEl.textContent = currentBatchId || "-";

        selectedSet.clear();
        currentRows.filter(r => r.ok).forEach(r => selectedSet.add(r.file_id));

        statusEl.textContent = `完成：共 ${currentRows.length} 个文件`;
        renderTable();

      } catch (e) {
        statusEl.textContent = "发生错误";
        document.getElementById("result").innerHTML = `<pre>${escapeHtml(String(e))}</pre>`;
      } finally {
        document.getElementById("run").disabled = false;
      }
    });

    document.getElementById("selectAll").addEventListener("click", () => {
      selectedSet.clear();
      currentRows.filter(r => r.ok).forEach(r => selectedSet.add(r.file_id));
      renderTable();
    });

    document.getElementById("selectNone").addEventListener("click", () => {
      selectedSet.clear();
      renderTable();
    });

    document.getElementById("exportSelected").addEventListener("click", async () => {
      const statusEl = document.getElementById("status");
      if (!currentBatchId) {
        alert("请先批量批改生成 batch_id");
        return;
      }
      if (selectedSet.size === 0) {
        alert("请先勾选至少一篇成功的作文");
        return;
      }

      const payload = {
        batch_id: currentBatchId,
        file_ids: Array.from(selectedSet),
      };

      statusEl.textContent = "正在导出所选报告（zip）…";
      document.getElementById("exportSelected").disabled = true;

      try {
        const resp = await fetch(API_STAGE2, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const ct = resp.headers.get("content-type") || "";
        if (!resp.ok) {
          if (ct.includes("application/json")) {
            const err = await resp.json();
            statusEl.textContent = "导出失败";
            alert(err.error || JSON.stringify(err));
          } else {
            statusEl.textContent = "导出失败";
            alert(`导出失败：HTTP ${resp.status}`);
          }
          return;
        }

        await downloadZipFromResponse(resp, `${currentBatchId}_Reports_Selected.zip`);
        statusEl.textContent = "已开始下载 zip";
      } catch (e) {
        statusEl.textContent = "导出失败";
        alert(String(e));
      } finally {
        updateSelectedCount();
      }
    });
  </script>
</body>
</html>
