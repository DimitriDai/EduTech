<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>词汇整理与导出</title>
  <style>
    :root {
      --bd:#e5e7eb;
      --txt:#111827;
      --muted:#6b7280;
      --ok:#16a34a;
      --bad:#dc2626;
      --bg:#ffffff;

      /* vocab theme */
      --vocab-soft:#e8f0e6;
      --vocab-accent:#cff7c8;
      --vocab-ink:#00897b;
    }

    /* 标题颜色 */
    .title {
      color: var(--vocab-ink);
    }

    *{box-sizing:border-box;}
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
           background: var(--bg); color: var(--txt); margin: 0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 26px 22px 44px; }
    .title{display:flex; align-items:baseline; gap:10px;}
    .title-ico{font-size: 28px; line-height: 1;}
    h1 { font-size: 32px; margin: 0 0 6px; letter-spacing: .2px; }
    .subtitle { color: var(--muted); margin: 0 0 18px; }
    h2 { font-size: 14px; font-weight: 600; margin: 14px 0 8px; color: var(--muted); letter-spacing: .2px; }
    .card { border: 1px solid var(--bd); border-radius: 12px; padding: 22px; background: #fff; }
    .card.soft { background: var(--vocab-soft); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
    .col { min-width: 0; }
    .col > *:last-child { margin-bottom: 0; }
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
    }
    textarea { width: 100%; min-height: 160px; resize: vertical; padding: 10px; border: 1px solid #dfe7e2; border-radius: 10px; outline: none; background:#fff; }
    input[type="text"] { width: 100%; padding: 9px 10px; border: 1px solid var(--bd); border-radius: 10px; outline: none; }
    select { padding: 8px 10px; border: 1px solid var(--bd); border-radius: 10px; background: #fff; }
    .btn { border: 1px solid var(--bd); border-radius: 10px; padding: 9px 12px; background: #fff; cursor: pointer; }
    .btn.primary { background: var(--vocab-ink); color: #fff; border-color: var(--vocab-ink); }
    .btn.secondary { background: #e7f5f1; color: var(--vocab-ink); border-color: #8fc7b8; }
    .btn.ghost { background: #ffffff; color: var(--vocab-ink); border-color: #8fc7b8; }
    .btn.secondary:hover, .btn.ghost:hover { background: #f2fbf8; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .muted { color: var(--muted); font-size: 13px; }
    .status .ok { color: var(--ok); font-weight: 700; }
    .status .bad { color: var(--bad); font-weight: 700; }
    .chips { display:flex; gap:8px; flex-wrap: wrap; margin-top: 8px; }
    .chip { border: 1px solid var(--bd); border-radius: 999px; padding: 6px 10px; cursor: pointer; font-size: 12px; background:#fff; }
    .chip.active { background:#111827; color:#fff; border-color:#111827; }
    .dlgrid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
    .dlitem { display:flex; align-items:center; gap:10px; padding: 8px; border:1px solid var(--bd); border-radius: 10px; }
    .dlitem code { font-size: 12px; color: #374151; }
    .dlitem .grow { flex: 1; }
    .log { width:100%; min-height: 160px; padding:10px; border:1px solid var(--bd); border-radius: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; white-space: pre-wrap; background:#fafafa; }
    .hint { padding: 10px; border: 1px dashed var(--bd); border-radius: 10px; color: var(--muted); font-size: 12px; background: #fafafa; }
    .divider { height:1px; background: var(--bd); margin: 14px 0; }

    /* UI: hide debug-only sections */
    .hide { display:none !important; }

    /* layout helpers */
    .stack { display:flex; flex-direction: column; gap: 10px; }
    .ocrbar { display:flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .ocrbar input[type="file"] { max-width: 280px; }
    .controls { display:flex; align-items:center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .controls .muted { font-size: 12px; }
    .inputs textarea { min-height: 220px; }

    /* keep counter in DOM but not shown */
    #charCounter { display:none; }

    .ico { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; color: var(--vocab-ink); }
    .ico svg { width:18px; height:18px; fill: currentColor; }
  
    .hero{ margin-bottom: 14px; }
    .results{ margin-top: 18px; }
    .results .card h2{ margin-top: 0; }

    /* layout closer to mock: green section + white inner panels */
    .section-title{margin-bottom:10px; display:flex; align-items:center; gap:8px; font-weight:700; color: var(--vocab-ink);} 
    .input-grid{display:grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start;}
    .panel{background:#f3f8f4; border:1px solid rgba(0,0,0,.06); border-radius: 14px; padding: 16px; box-shadow: 0 1px 0 rgba(0,0,0,.02);}
    .panel-head{display:flex; align-items:center; gap:8px; margin: 0 0 10px; font-weight:700; color: #0f172a;}
    .panel-sub{color: var(--muted); font-size: 12px; margin: 0 0 10px;}
    .ocrbar{margin:0 0 10px; display:flex; gap: 10px; align-items: center; flex-wrap: wrap;}
    .inputs textarea{min-height: 230px;}
    .controls{margin-top: 12px;}
    .name-row{display:flex; flex-direction:column; gap:8px;}
    .preset-wrap{background: var(--vocab-accent); border-radius: 14px; padding: 14px;}
    .runbar{display:flex; gap:10px; align-items:center; margin-top: 12px; flex-wrap: wrap;}
    .runmeta{color: var(--muted); font-size: 12px;}

    .divider.orand{
      position: relative;
      height: 1px;
      background: rgba(15,23,42,.10);
      margin: 14px 0;
    }
    .divider.orand > span{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 0 10px;
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .2px;
    }

    @media (max-width: 900px){
      .input-grid{grid-template-columns:1fr;}
    }
    /* ========= Output zone states ========= */
    #outputZone.is-hidden{ display:none; }

    /* pending：浅 + 禁用交互 + 禁止选中文字 */
    .output-card.is-pending{
      opacity: .55;
      filter: grayscale(.08);
      pointer-events: none;
      user-select: none;
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: none;
    }

    /* ready：恢复交互 + 轻微强化 */
    .output-card.is-ready{
      opacity: 1;
      filter: none;
      pointer-events: auto;
      user-select: auto;
      border: 1px solid rgba(15,23,42,.20);
      box-shadow: 0 1px 0 rgba(15,23,42,.06);
    }

  </style>
</head>
<body>

<div class="wrap">

  <!-- Layer 1: 顶部任务区（标题 + 一句话） -->
  <header class="hero">
    <h1 class="title">
      <span class="title-ico" aria-hidden="true">📚</span><span>Vocabulary</span>
    </h1>
    <p class="subtitle">把文章、截图或课堂笔记里的重点词，一次整理成可下载的词汇表和练习</p>
  </header>

  <!-- Layer 2: 配置区（输入、配置、输出） -->
  <main class="card soft">

    <div class="input-grid">
      <!-- Panel A: 输入 -->
      <section class="panel inputs">
        <div class="panel-head">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM7 11h10v2H7v-2zm0 4h10v2H7v-2zm0 4h7v2H7v-2z"/></svg>
          </span>
          <span>输入</span>
        </div>

        <div class="ocrbar">
          <input type="file" id="ocrFile" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff" />
          <button class="btn secondary" id="btnOCR">🪄 识别并追加到文章</button>
          <div id="ocrHint" class="muted"></div>
        </div>

        <textarea id="passage" placeholder="在这里粘贴文章，或是词汇笔记，截图识别的文字也会自动追加到这里"></textarea>
        <div id="charCounter" class="muted" style="margin-top:6px;">0 / 20000 chars</div>

        <div class="controls">
          <span class="muted" style="display:inline-flex; align-items:center; gap:6px;">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 6h18v2H3v-2zm0 6h12v2H3v-2z"/></svg></span>
            <span>提取数量</span>
          </span>
          <select id="countSel">
            <option value="15" selected>15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="80">80</option>
            <option value="100">100</option>
            <option value="150">150</option>
          </select>
          <span class="muted">（词汇越多运行越久哦）</span>
        </div>

        <!-- 这里是你要的 “or/and” -->
        <div class="divider orand"><span>or / and</span></div>

        <div class="panel-head" style="margin-top:4px;">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9l-5 3V5zm4 2h8v2H8V7zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
          </span>
          <span>输入笔记</span>
        </div>
        <textarea id="scattered" placeholder="输入词汇笔记，支持逗号分隔或换行"></textarea>
      </section>

      <!-- Panel B: 输出配置 -->
      <section class="panel options">
        <div class="panel-head">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.83H5v-.92l8.06-8.06.92.92L5.92 20.08zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/></svg>
          </span>
          <span>输出配置</span>
        </div>

        <div class="name-row">
          <div class="muted">自定义命名（可选）</div>
          <input id="namePrefix" type="text" placeholder="" />
        </div>

        <div class="divider"></div>

        <div class="preset-wrap">
          <div class="muted" style="display:flex; align-items:center; gap:8px; margin-bottom: 8px;">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-2h2v2zm1.07-7.75-.9.92A1.49 1.49 0 0 0 13 12v1h-2v-1a3 3 0 0 1 .88-2.12l1.24-1.26a1.5 1.5 0 1 0-2.56-1.06H8.5a3.5 3.5 0 1 1 6 2.69z"/></svg></span>
            <span>词表版式</span>
            <span>（默认：各版式均含中英释义）</span>
          </div>

          <div class="chips" id="presetChips">
            <button class="chip active" data-preset="synonyms">含同义替换</button>
            <button class="chip" data-preset="all">全字段</button>
            <button class="chip" data-preset="sent">含例句</button>
            <button class="chip" data-preset="basic">基础中英释义</button>
          </div>
        </div>

        <!-- 仅用于前端调试：预览输出区 -->
        <label class="muted" style="display:flex; align-items:center; gap:8px; margin:6px 0 2px;">
          <input type="checkbox" id="togglePreviewOutput">
          预览输出区
        </label>

        <div class="divider"></div>

        <!-- 生成按钮放这里 -->
        <div class="runbar" style="margin-top: 2px;">
          <button class="btn primary" id="btnRun">⚡ 提取并生成</button>
          <div class="runmeta">当前 run_id：<code id="runId">-</code></div>
          <div class="status muted" id="runStatus"></div>
        </div>
        
        <!-- 输出区：默认不展示；点击“提取并生成”后才出现 -->
        <section id="outputZone" class="is-hidden" aria-hidden="true">

          <div class="divider"></div>

          <div class="card output-card is-pending" id="cardVocab" style="margin-top:10px;">
            <div class="panel-head">输出词表</div>
            <div class="status muted" id="vocabNoteStatus">-</div>
            <div id="vocabNoteArea" class="hint">尚未生成</div>
            <div style="display:flex; gap:10px; margin-top:10px;">
              <button class="btn ghost" id="btnDownloadVocab" disabled>下载所选</button>
            </div>
          </div>

          <div class="card output-card is-pending" id="cardPractice" style="margin-top:12px;">
            <div class="panel-head">输出练习</div>
            <div class="status muted" id="practiceStatus">-</div>
            <div id="practiceArea" class="hint">尚未生成</div>
            <div style="display:flex; gap:10px; margin-top:10px;">
              <button class="btn ghost" id="btnDownloadPractice" disabled>下载所选</button>
            </div>
          </div>

          <div class="card output-card is-pending" id="cardGrading" style="margin-top:12px;">
            <div class="panel-head">自动批改</div>
            <div class="muted">仅接受本工具生成的“练习_例句_中译英”docx（或 zip）。</div>
            <div style="display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap: wrap;">
              <input type="file" id="gradingFile" accept=".docx,.zip" disabled />
              <button class="btn ghost" id="btnGrade" disabled>上传并批改</button>
              <div class="status muted" id="gradingMsg">-</div>
            </div>
          </div>

        </section> <!-- /outputZone -->
      </section> <!-- /Panel B -->
    </div>

    <!-- 日志保留在 main 末尾（仍然最弱、最底） -->
    <textarea class="log hide" id="log" readonly></textarea>
  </main>

</div>

<script>
  const $ = (id) => document.getElementById(id);

  // =============== Config ===============
  const API = window.location.origin;

  const AUDIO_ROOT =
    (API.includes("127.0.0.1") || API.includes("localhost"))
      ? "storage/audio_cache"
      : "/home/ubuntu/EduTech/vocab_service/storage/audio_cache";

  const OCR_API = API + "/vocab/v1/ocr/passagetext";

  const MAX_CHARS = 20000;

  const ENDPOINTS = {

    // ===== 核心流程 =====
    pipeline: API + "/vocab/v1/vocab/pipeline",

    // ===== 词汇笔记导出 =====
    exportVocabNote: API + "/vocab/v1/export/vocab_note",

    // ===== 音频相关 =====
    audioGenerateFromVocabNote:
      API + "/vocab/v1/audio/generate_from_vocab_note",
    audioVocabNoteCompose:
      API + "/vocab/v1/audio/vocab_note",
    practiceComposeAudio:
      API + "/vocab/v1/audio/compose",

    // ===== 练习生成 =====
    practiceMaster:
      API + "/vocab/v1/practice/master",
    practiceDocx:
      API + "/vocab/v1/practice/docx",

    // ===== 文件列表 / 下载 =====
    filesList: (runId, category) =>
      API + `/vocab/v1/files/out/${runId}/${category}`,

    downloadFile: (runId, category, filename) =>
      API +
      `/vocab/v1/files/out/${runId}/${category}/${encodeURIComponent(filename)}`,

    categoryZip: (runId, category) =>
      API + `/vocab/v1/files/out/${runId}/${category}/zip`,
  };   // ✅ ENDPOINTS 在这里正确结束


  const CATS = {
    vocab_note: "vocab_note",
    practice_docx: "practice_docx",
    audio: "audio",
  };

  // =============== DOM ===============
  let OUTPUT_PHASE = "idle"; 
  // "idle" | "running" | "done"
  const logEl = $("log");
  const runIdEl = $("runId");
  const runStatus = $("runStatus");
  
  const passageEl = $("passage");
  const charCounterEl = $("charCounter");

  const ocrFileEl = $("ocrFile");
  const btnOCR = $("btnOCR");
  const ocrHintEl = $("ocrHint");

  const vocabNoteArea = $("vocabNoteArea");
  const vocabNoteStatus = $("vocabNoteStatus");
  const btnDownloadVocab = $("btnDownloadVocab");

  const practiceArea = $("practiceArea");
  const practiceStatus = $("practiceStatus");
  const btnDownloadPractice = $("btnDownloadPractice");

  const btnRun = $("btnRun");

  const gradingFileEl = $("gradingFile");
  const btnGrade = $("btnGrade");
  const gradingMsg = $("gradingMsg");
  const previewToggle = $("togglePreviewOutput");

  // =============== State ===============
  let activePreset = "synonyms";
  let currentRunId = "";
  let lastExport = null;     // { excel, docx, ... }
  let lastMaster = null;     // { output_xlsx, meta_json, ... }
  let vocabExcelPath = "";   // exportResp.excel
  let masterXlsxPath = "";   // masterResp.output_xlsx

  // =============== Helpers ===============
  function updateCharCounter() {
    const len = (passageEl.value || "").length;
    charCounterEl.textContent = `${len} / ${MAX_CHARS} chars`;
    charCounterEl.style.color = (len > MAX_CHARS) ? "#dc2626" : "#6b7280";
  }
  passageEl.addEventListener("input", updateCharCounter);
  updateCharCounter();

  btnOCR.addEventListener("click", async () => {
    const file = ocrFileEl.files[0];
    if (!file) {
      alert("请先选择一个 PDF 或图片文件");
      return;
    }

    btnOCR.disabled = true;
    ocrHintEl.textContent = "OCR 识别中，请稍候…";

    try {
      const fd = new FormData();
      fd.append("file", file);

      const res = await fetch(OCR_API, {
        method: "POST",
        body: fd
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(txt);
      }

      const data = await res.json();
      const ocrText = data.passage_text || "";

      const existing = passageEl.value || "";
      const sep = existing ? "\n\n--- OCR Imported Text ---\n\n" : "";
      const merged = existing + sep + ocrText;

      if (merged.length > MAX_CHARS) {
        const remain = MAX_CHARS - existing.length - sep.length;
        if (remain <= 0) {
          alert("当前内容已接近 20000 字符上限，无法追加 OCR。");
          return;
        }

        const ok = confirm(
          "OCR 内容会超过 20000 字符上限。\n\n" +
          "【确定】仅追加可容纳的一部分\n" +
          "【取消】不追加"
        );

        if (ok) {
          passageEl.value = existing + sep + ocrText.slice(0, remain);
        }
      } else {
        passageEl.value = merged;
      }

      ocrHintEl.textContent = "OCR 已完成并追加到 Passage";
      updateCharCounter();

    } catch (e) {
      ocrHintEl.textContent = "OCR 失败";
      alert("OCR 失败：" + e.message);
    } finally {
      btnOCR.disabled = false;
      ocrFileEl.value = "";
    }
  });

  function showOutputPending() {
    OUTPUT_PHASE = "running";
    const zone = $("outputZone");
    if (!zone) return;

    zone.classList.remove("is-hidden");
    zone.setAttribute("aria-hidden", "false");

    ["cardVocab", "cardPractice", "cardGrading"].forEach(id => {
      const el = $(id);
      if (!el) return;
      el.classList.add("is-pending");
      el.classList.remove("is-ready");
    });

    // 明确禁用（与 pending 视觉一致）
    btnDownloadVocab.disabled = true;
    btnDownloadPractice.disabled = true;
    gradingFileEl.disabled = true;
    btnGrade.disabled = true;
  }
  function applyPreviewToggle() {
    if (!previewToggle) return;

    const zone = $("outputZone");
    if (!zone) return;

    // running/done 时，预览不允许覆盖真实状态
    if (OUTPUT_PHASE !== "idle") return;

    if (previewToggle.checked) {
      // 强制显示输出区，但保持 pending 状态（仅用于看布局）
      zone.classList.remove("is-hidden");
      zone.setAttribute("aria-hidden", "false");

      ["cardVocab","cardPractice","cardGrading"].forEach(id => {
        const el = $(id);
        if (!el) return;
        el.classList.add("is-pending");
        el.classList.remove("is-ready");
      });

      btnDownloadVocab.disabled = true;
      btnDownloadPractice.disabled = true;
      gradingFileEl.disabled = true;
      btnGrade.disabled = true;
    } else {
      // idle 且未生成过才隐藏
      if (zone.dataset.generated !== "1") {
        zone.classList.add("is-hidden");
        zone.setAttribute("aria-hidden", "true");
      }
    }
  }

  function setOutputReady({ vocabReady, practiceReady }) {
    OUTPUT_PHASE = "done";
    if (vocabReady) {
      const el = $("cardVocab");
      el.classList.remove("is-pending");
      el.classList.add("is-ready");
      btnDownloadVocab.disabled = false;
    }
    if (practiceReady) {
      const el = $("cardPractice");
      el.classList.remove("is-pending");
      el.classList.add("is-ready");
      btnDownloadPractice.disabled = false;

      // 批改依赖练习输出：练习 ready 才允许选文件
      const g = $("cardGrading");
      g.classList.remove("is-pending");
      g.classList.add("is-ready");
      gradingFileEl.disabled = false;
      // btnGrade 继续由 change 事件控制（没选文件就禁用）
      btnGrade.disabled = !(gradingFileEl.files && gradingFileEl.files.length > 0);
    }
  }

  function setOutputFailed(msg) {
    const m = msg || "失败";
    vocabNoteStatus.innerHTML = `<span class="bad">${escapeHtml(m)}</span>`;
    practiceStatus.innerHTML = `<span class="bad">${escapeHtml(m)}</span>`;
  }

  function log(msg) {
    const t = new Date().toISOString().slice(11, 19);
    logEl.value += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));
  }

  function prefixOrEmpty() {
    const raw = ($("namePrefix").value || "").trim();
    if (!raw) return "";
    // 轻度清洗：空格->下划线，非法字符->下划线
    return raw
      .replace(/\s+/g, "_")
      .replace(/[\\/:*?"<>|]+/g, "_")
      .slice(0, 50) + "__";
  }

  async function postJson(url, bodyObj) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify(bodyObj)
    });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`HTTP ${res.status}: ${txt}`);
    }
    return await res.json();
  }

  async function listOutFiles(runId, cat) {
    const res = await fetch(ENDPOINTS.filesList(runId, cat));
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`list files failed HTTP ${res.status}: ${txt}`);
    }
    const data = await res.json();
    return Array.isArray(data.files) ? data.files : [];
  }

  async function downloadBlob(url, filename) {
    const res = await fetch(url);
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`download failed HTTP ${res.status}: ${txt}`);
    }
    const blob = await res.blob();
    const a = document.createElement("a");
    const u = URL.createObjectURL(blob);
    a.href = u;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(u);
  }

  function renderMixedList(containerEl, items, groupKey) {
    if (!items || items.length === 0) {
      containerEl.innerHTML = `<div class="hint">未发现文件</div>`;
      return;
    }
    const html = items.map(({cat, fn}) => {
      const safe = escapeHtml(fn);
      const id = `${groupKey}__${cat}__${fn}`.replace(/[^a-zA-Z0-9_\-:.]/g, "_");
      return `
        <div class="dlitem">
          <input type="checkbox" checked data-group="${escapeHtml(groupKey)}" data-cat="${escapeHtml(cat)}" data-fn="${safe}" />
          <div class="grow">
            <div><code>${escapeHtml(cat)}</code> <span class="muted">${safe}</span></div>
          </div>
          <button class="btn" data-dl="1" data-cat="${escapeHtml(cat)}" data-fn="${safe}">下载</button>
        </div>
      `;
    }).join("");
    containerEl.innerHTML = `<div class="dlgrid">${html}</div>`;
  }

  function getChecked(groupKey) {
    const nodes = document.querySelectorAll(`input[type="checkbox"][data-group="${groupKey}"]:checked`);
    return Array.from(nodes).map(n => ({ cat: n.getAttribute("data-cat"), fn: n.getAttribute("data-fn") }));
  }

  function selectedFieldsForPreset(preset) {
    // 你目前已验证：synonyms 预设要 pos_cn, phonetic_uk, synonyms
    if (preset === "synonyms") return ["pos_cn", "phonetic_uk", "synonyms"];

    // 下面三种你后端能不能支持取决于 field_definitions（先给合理默认）
    if (preset === "basic") return ["pos_cn", "phonetic_uk"]; // 基础释义（可后续扩展成 cn/en meaning）
    if (preset === "sent")  return ["pos_cn", "phonetic_uk", "example", "example_cn"]; // 含例句（若后端字段名不同，再改这里）
    return ["word_norm", "phonetic_uk", "pos_cn", "synonyms", "example", "example_cn"];
  }

  // =============== Preset UI ===============
  document.querySelectorAll("#presetChips .chip").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#presetChips .chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activePreset = btn.getAttribute("data-preset");
      log(`preset => ${activePreset}`);
    });
  });

  // =============== Main flow ===============
  if (previewToggle) {
    previewToggle.addEventListener("change", applyPreviewToggle);
    applyPreviewToggle();
  }

  btnRun.addEventListener("click", async () => {
    const passageLen = (passageEl.value || "").length;
    if (passageLen > MAX_CHARS) {
      alert(`Passage 超过 ${MAX_CHARS} 字符上限，请精简后再运行。`);
      return;
    }

    btnRun.disabled = true;

    runStatus.innerHTML = `<span class="muted">运行中...</span>`;
    vocabNoteArea.innerHTML = `<div class="hint">生成中...</div>`;
    practiceArea.innerHTML = `<div class="hint">生成中...</div>`;
    btnDownloadVocab.disabled = true;
    btnDownloadPractice.disabled = true;
    showOutputPending();

    currentRunId = "";
    lastExport = null;
    lastMaster = null;
    vocabExcelPath = "";
    masterXlsxPath = "";

    try {
      const passageText = ($("passage").value || "").trim();
      const scatteredText = ($("scattered").value || "").trim();
      const count = parseInt($("countSel").value, 10);
      const selected_fields = selectedFieldsForPreset(activePreset);

      // 1) pipeline
      const pipReq = {
        passage_text: passageText,
        scattered_text: scatteredText,
        count,
        selected_fields,
        cache_mode: "FORCE_OVERWRITE",
        force_regen: true,
        temp_only: false
      };
      log(`POST pipeline\n${JSON.stringify(pipReq)}`);
      const pipResp = await postJson(ENDPOINTS.pipeline, pipReq);
      log(`pipelineResp: run_id=${pipResp.run_id} words=${(pipResp.words_merged||[]).length}`);

      currentRunId = pipResp.run_id;
      runIdEl.textContent = currentRunId;

      // 2) export vocab_note

      function vocabNoteVariantForPreset(preset) {
        // 这几个字符串必须和后端 ExportVocabNoteRequest.variant 支持的枚举一致
        if (preset === "synonyms") return "with_synonyms";     // 同义替换版
        if (preset === "sent")     return "with_example";     // 含例句版（横板：No/word_norm/phonetic/pos_cn/example）
        if (preset === "basic")    return "basic_cn";             // 基础版（如果你后端支持）
        return "all_fields";                                  // 全字段（如果你后端支持）
      }

      const exportReq = {
        run_id: currentRunId,
        sheet_name: "vocab",
        output_xlsx: "",
        output_docx: "",
        variant: vocabNoteVariantForPreset(activePreset),
      };
      
      log(`POST export vocab_note\n${JSON.stringify(exportReq)}`);
      const exportResp = await postJson(ENDPOINTS.exportVocabNote, exportReq);
      lastExport = exportResp;

      // ✅ 确认字段：exportResp.excel / exportResp.docx（你已给出）
      vocabExcelPath = exportResp.excel || "";
      const vocabDocxPath = exportResp.docx || "";
      log(`exportResp: excel=${vocabExcelPath} docx=${vocabDocxPath}`);

      // 3) generate missing audio（optional）
      try {
        const genReq = {
          run_id: currentRunId,
          vocab_excel: vocabExcelPath,
          sheet_name: "vocab",
          accents: ["uk", "us"],
          max_words: 200,
          write_uploaded: true
        };
        log(`POST audio generate_from_vocab_note (optional)\n${JSON.stringify(genReq)}`);
        await postJson(ENDPOINTS.audioGenerateFromVocabNote, genReq);
        log(`generate_from_vocab_note OK`);
      } catch (e) {
        log(`generate_from_vocab_note failed (ignored): ${String(e.message || e)}`);
      }

      // 4) compose final vocab_note mp3（以成功为准）
      let vocabAudioOk = false;
      try {
        const composeReq = {
          run_id: currentRunId,
          vocab_excel: vocabExcelPath,
          only_sheets: "vocab",
          audio_root: AUDIO_ROOT,
          ffmpeg_bin: "ffmpeg",
          ffprobe_bin: "ffprobe",
          no_manifest: false,
          global_cache: "storage/global_cache.json",
          uploaded_cache: "storage/uploaded_vocab_cache.json",
          accent: "uk",
          // 不传 output_mp3，让后端默认（避免你 S4 那种写错 run_id 的情况）
          output_mp3: ""
        };
        log(`POST audio vocab_note (compose final)\n${JSON.stringify(composeReq)}`);
        const composeResp = await postJson(ENDPOINTS.audioVocabNoteCompose, composeReq);
        log(`compose vocab_note resp: ${JSON.stringify(composeResp)}`);
        vocabAudioOk = true;
      } catch (e) {
        vocabAudioOk = false;
        log(`compose vocab_note failed: ${String(e.message || e)}`);
      }

      // 5) list + render vocab_note downloads
      const vnFiles = await listOutFiles(currentRunId, CATS.vocab_note);
      const items = vnFiles
        .filter(fn => /\.(docx|xlsx)$/i.test(fn))
        .map(fn => ({ cat: CATS.vocab_note, fn }));

      if (vocabAudioOk) {
        try {
          const auFiles = await listOutFiles(currentRunId, CATS.audio);
          const target = `vocab_note__${currentRunId}.mp3`;
          if (auFiles.includes(target)) {
            items.push({ cat: CATS.audio, fn: target });
          } else {
            // 兜底：按前缀匹配
            const cand = auFiles.filter(fn => fn.includes(`vocab_note__${currentRunId}`) && /\.mp3$/i.test(fn));
            if (cand.length > 0) items.push({ cat: CATS.audio, fn: cand[0] });
          }
        } catch {}
      }

      renderMixedList(vocabNoteArea, items, "vocab");
      btnDownloadVocab.disabled = items.length === 0;
      vocabNoteStatus.innerHTML = items.length ? `<span class="ok">就绪</span>` : `<span class="bad">未发现文件</span>`;

      // 6) practice master (S5)
      const masterReq = {
        run_id: currentRunId,
        vocab_excel: vocabExcelPath,
        sheet_name: "vocab",
        output_xlsx: "",
        meta_json: "",
        max_rows_per_sheet: 25,
        base_sheet_name: "shuffle_e2c",
        seed: 0
      };
      log(`POST practice/master\n${JSON.stringify(masterReq)}`);
      const masterResp = await postJson(ENDPOINTS.practiceMaster, masterReq);
      lastMaster = masterResp;
      masterXlsxPath = masterResp.output_xlsx || "";
      log(`masterResp: master_xlsx=${masterXlsxPath}`);

      // 7) practice docx (S6)
      const docxReq = {
        run_id: currentRunId,
        master_xlsx: masterXlsxPath,
        output_dir: "",
        types: [],
        timestamp: ""
      };
      log(`POST practice/docx\n${JSON.stringify(docxReq)}`);
      const docxResp = await postJson(ENDPOINTS.practiceDocx, docxReq);
      log(`practice docx resp: ${JSON.stringify(docxResp)}`);

      // 8) practice compose audio (S7)（失败不阻断）
      let practiceAudioOk = false;
      try {
        const paReq = {
          run_id: currentRunId,
          master_xlsx: masterXlsxPath,
          sheet: "",
          make_parts: true,
          prefix: "",
          output_dir: "",
          audio_root: AUDIO_ROOT,
          ffmpeg_bin: "ffmpeg",
          ffprobe_bin: "ffprobe",
          no_manifest: false
        };
        log(`POST audio compose practice (optional)\n${JSON.stringify(paReq)}`);
        const paResp = await postJson(ENDPOINTS.practiceComposeAudio, paReq);
        log(`practice audio resp: ${JSON.stringify(paResp)}`);
        practiceAudioOk = true;
      } catch (e) {
        practiceAudioOk = false;
        log(`practice audio compose failed (ignored): ${String(e.message || e)}`);
      }

      // 9) list + render practice downloads
      const pdFiles = await listOutFiles(currentRunId, CATS.practice_docx);
      const wantDocx = (activePreset === "synonyms")
        ? pdFiles.filter(fn => /单词/i.test(fn) && !/例句/i.test(fn))
        : pdFiles;

      const pitems = wantDocx
        .filter(fn => /\.docx$/i.test(fn))
        .map(fn => ({ cat: CATS.practice_docx, fn }));

      if (practiceAudioOk) {
        try {
          const auFiles = await listOutFiles(currentRunId, CATS.audio);
          const target = `practice_master__${currentRunId}__shuffle_e2c_full.mp3`;
          if (auFiles.includes(target)) {
            pitems.push({ cat: CATS.audio, fn: target });
          } else {
            const cand = auFiles.filter(fn =>
              fn.includes(`practice_master__${currentRunId}`) &&
              fn.includes("shuffle_e2c") &&
              fn.includes("_full") &&
              /\.mp3$/i.test(fn)
            );
            if (cand.length > 0) pitems.push({ cat: CATS.audio, fn: cand[0] });
          }
        } catch {}
      }

      renderMixedList(practiceArea, pitems, "practice");
      btnDownloadPractice.disabled = pitems.length === 0;
      practiceStatus.innerHTML = pitems.length ? `<span class="ok">就绪</span>` : `<span class="bad">未发现文件</span>`;
      setOutputReady({
        vocabReady: items.length > 0,
        practiceReady: pitems.length > 0
      });
      $("outputZone").dataset.generated = "1";
      
      runStatus.innerHTML = `<span class="ok">完成</span>`;
      log(`DONE run_id=${currentRunId}`);

    } catch (e) {
      runStatus.innerHTML = `<span class="bad">${escapeHtml(String(e.message || e))}</span>`;
      vocabNoteArea.innerHTML = `<div class="hint">-</div>`;
      practiceArea.innerHTML = `<div class="hint">-</div>`;
      vocabNoteStatus.innerHTML = `<span class="bad">失败</span>`;
      practiceStatus.innerHTML = `<span class="bad">失败</span>`;
      log(`ERROR: ${String(e.message || e)}`);
      alert(String(e.message || e));
      setOutputFailed(String(e.message || e));
    } finally {
      btnRun.disabled = false;
    }
  });

  // =============== Single download buttons ===============
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-dl]");
    if (!b) return;
    if (!currentRunId) return;

    const cat = b.getAttribute("data-cat");
    const fn = b.getAttribute("data-fn");
    const outName = prefixOrEmpty() + fn; // 不改后端，仅改下载名

    try {
      await downloadBlob(ENDPOINTS.downloadFile(currentRunId, cat, fn), outName);
      log(`download single OK: ${cat}/${fn} => ${outName}`);
    } catch (err) {
      log(`download single FAILED: ${String(err.message || err)}`);
      alert(String(err.message || err));
    }
  });

  // =============== Multi-download: vocab (by category zip) ===============
  btnDownloadVocab.addEventListener("click", async () => {
    if (!currentRunId) return;
    const picked = getChecked("vocab");
    if (picked.length === 0) return alert("未选择文件");

    const prefixRaw = ($("namePrefix").value || "").trim();

    try {
      if (picked.length === 1) {
        const {cat, fn} = picked[0];
        await downloadBlob(ENDPOINTS.downloadFile(currentRunId, cat, fn), prefixOrEmpty() + fn);
        return;
      }
      const groups = {};
      picked.forEach(it => {
        groups[it.cat] = groups[it.cat] || [];
        groups[it.cat].push(it.fn);
      });
      for (const cat of Object.keys(groups)) {
        const zipName = `${prefixOrEmpty()}bundle__${currentRunId}__${cat}.zip`;
        await downloadBlob(ENDPOINTS.categoryZip(currentRunId, cat, prefixRaw), zipName);
      }
      log(`download vocab bundles OK`);
    } catch (e) {
      log(`download vocab bundles FAILED: ${String(e.message || e)}`);
      alert(String(e.message || e));
    }
  });

  // =============== Multi-download: practice (by category zip) ===============
  btnDownloadPractice.addEventListener("click", async () => {
    if (!currentRunId) return;
    const picked = getChecked("practice");
    if (picked.length === 0) return alert("未选择文件");

    const prefixRaw = ($("namePrefix").value || "").trim();

    try {
      if (picked.length === 1) {
        const {cat, fn} = picked[0];
        await downloadBlob(ENDPOINTS.downloadFile(currentRunId, cat, fn), prefixOrEmpty() + fn);
        return;
      }
      const groups = {};
      picked.forEach(it => {
        groups[it.cat] = groups[it.cat] || [];
        groups[it.cat].push(it.fn);
      });
      for (const cat of Object.keys(groups)) {
        const zipName = `${prefixOrEmpty()}bundle__${currentRunId}__${cat}.zip`;
        await downloadBlob(ENDPOINTS.categoryZip(currentRunId, cat, prefixRaw), zipName);
      }
      log(`download practice bundles OK`);
    } catch (e) {
      log(`download practice bundles FAILED: ${String(e.message || e)}`);
      alert(String(e.message || e));
    }
  });

  // =============== Grading ===============
  gradingFileEl.addEventListener("change", () => {
    btnGrade.disabled = !(gradingFileEl.files && gradingFileEl.files.length > 0);
  });

  btnGrade.addEventListener("click", async () => {
    if (!(gradingFileEl.files && gradingFileEl.files[0])) return;
    const f = gradingFileEl.files[0];
    btnGrade.disabled = true;
    gradingMsg.textContent = "批改中...";

    try {
      const fd = new FormData();
      fd.append("file", f);

      // 这里假设你的 grading route 是 /v1/grading/upload 或类似；
      // 你原本代码里 ENDPOINTS.grading 没贴出来，我保持“从全局变量读”——你自己把它补上即可。
      // 如果你已在旧版 index.html 里定义了 ENDPOINTS.grading，把下面这行替换成你真实 endpoint。
      const gradingEndpoint = (ENDPOINTS.grading) ? ENDPOINTS.grading : (API + "/v1/grading/upload");

      log(`POST grading upload: ${f.name}`);
      const res = await fetch(gradingEndpoint, { method: "POST", body: fd });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`批改失败 HTTP ${res.status}: ${txt}`);
      }
      const blob = await res.blob();

      const a = document.createElement("a");
      const u = URL.createObjectURL(blob);
      a.href = u;

      const base = f.name.replace(/\.(docx|zip)$/i, "");
      const ext = f.name.toLowerCase().endsWith(".zip") ? "zip" : "docx";
      a.download = `${prefixOrEmpty()}${base}__graded.${ext}`;

      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(u);

      gradingMsg.innerHTML = `<span class="ok">批改完成，已开始下载</span>`;
      log(`grading OK => download started`);
    } catch (e) {
      gradingMsg.innerHTML = `<span class="bad">${escapeHtml(String(e.message || e))}</span>`;
      log(`grading FAILED: ${String(e.message || e)}`);
      alert(String(e.message || e));
    } finally {
      btnGrade.disabled = false;
    }
  });
</script>
</body>
</html>
