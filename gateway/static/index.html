<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EduTech 入口</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#667085;
      --border:rgba(16,24,40,.10);
      --shadow:0 10px 30px rgba(16,24,40,.08);
      --shadow2:0 14px 26px rgba(16,24,40,.12);
      --radius:18px;

      /* Your banner-derived theme colors */
      --vocab-a:#cff7c8;
      --vocab-b:#e8f0e6;
      --vocab-ink:#00897b;

      --write-a:#ffda6a;
      --write-b:#fff7de;
      --write-ink:#cc7a00;
      --write-ink2:#7e6709;

      --speak-a:#c3d8ff;
      --speak-b:#ffffff;
      --speak-ink:#2165c7;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a{ color:inherit; text-decoration:none; }

    .wrap{
      max-width: 980px;
      margin: 26px auto 40px;
      padding: 0 16px;
    }

    /* Header */
    .header{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom: 12px;
    }
    .header h1{
      margin:0;
      font-size: 34px;
      letter-spacing: .2px;
    }
    .header .sub{
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    /* Banner (short) */
    .banner{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin: 12px 0 16px;
    }
    .banner-viewport{
      position: relative;
      width: 100%;
      height: 200px;            /* 桌面高度：你要更矮就改成 160-190 */
      background: #fff;
      overflow: hidden;
    }
    @media (max-width: 920px){
      .banner-viewport{ height: 150px; } /* 手机高度 */
      .header h1{ font-size: 30px; }
    }

    .banner-viewport img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      opacity:0;
      transition: opacity .35s ease;

      /* 兜底：就算图片 404，也不显示 alt 文本 */
      font-size: 0;
      color: transparent;
    }
    .banner-viewport img.active{ opacity:1; }

    .dots{
      display:flex;
      justify-content:center;
      gap:10px;
      padding: 10px 0 12px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.95));
    }
    .dot{
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(0,0,0,.18);
    }
    .dot.active{ background: rgba(0,0,0,.55); }

    /* Modules stack */
    .grid{
      display:grid;
      grid-template-columns: 1fr;   /* 强制竖排 */
      gap: 14px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head{
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .card-head .name{
      display:flex;
      flex-direction:column;
      gap: 2px;
    }
    .card-head .name h2{
      margin:0;
      font-size: 18px;
      letter-spacing: .2px;
    }
    .card-head .name span{
      font-size: 12px;
      color: rgba(17,24,39,.60);
    }

    .card-body{
      padding: 12px 16px 16px;
    }

    /* Lively button */
    .btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.78);
      box-shadow: 0 8px 18px rgba(16,24,40,.08);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadow2);
      background: rgba(255,255,255,.92);
    }
    .btn:active{
      transform: translateY(0px);
      box-shadow: 0 10px 20px rgba(16,24,40,.10);
    }

    .btn .left{
      display:flex;
      flex-direction:column;
      gap: 4px;
      min-width: 0;
    }
    .btn .title{
      font-size: 16px;
      font-weight: 750;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn .desc{
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn .arrow{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display:grid;
      place-items:center;
      background: rgba(0,0,0,.04);
      flex: 0 0 auto;
      font-size: 18px;
      line-height: 1;
      color: rgba(17,24,39,.75);
    }

    /* Module themes */
    .vocab .card-head{
      background: linear-gradient(135deg, var(--vocab-a), var(--vocab-b));
    }
    .vocab .card-head h2{ color: var(--vocab-ink); }

    .speaking .card-head{
      background: linear-gradient(135deg, var(--speak-a), var(--speak-b));
    }
    .speaking .card-head h2{ color: var(--speak-ink); }

    .writing .card-head{
      background: linear-gradient(135deg, var(--write-a), var(--write-b));
    }
    .writing .card-head h2{ color: var(--write-ink); }

    /* Small detail: keep everything airy */
    .card-body .btn + .btn{ margin-top: 10px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1>Teachers' Toolkit</h1>
      <div class="sub">Make Your Teaching Easier</div>
    </div>

    <!-- Banner carousel
         图片路径：gateway/static/assets/banners/
         这里用相对路径：assets/banners/*.png
    -->
    <section class="banner" aria-label="轮播图">
      <div class="banner-viewport" id="bannerViewport">
        <img class="active" src="assets/banners/vocabulary.png" alt="" loading="eager">
        <img src="assets/banners/speaking.png" alt="" loading="lazy">
        <img src="assets/banners/writing.png" alt="" loading="lazy">
      </div>

      <div class="dots" aria-label="轮播切换">
        <button class="dot active" type="button" aria-label="Vocabulary"></button>
        <button class="dot" type="button" aria-label="Speaking"></button>
        <button class="dot" type="button" aria-label="Writing"></button>
      </div>
    </section>

    <!-- Modules (vertical) -->
    <section class="grid" aria-label="模块入口">
      <article class="card vocab">
        <div class="card-head">
          <div class="name">
            <h2>Vocabulary</h2>
          </div>
        </div>
        <div class="card-body">
          <a class="btn" href="/vocab/static/index.html" target="_blank" rel="noopener">
            <span class="left">
              <span class="title">词汇整理导出</span>
            </span>
            <span class="arrow">›</span>
          </a>
        </div>
      </article>

      <article class="card speaking">
        <div class="card-head">
          <div class="name">
            <h2>Speaking</h2>
          </div>
        </div>
        <div class="card-body">
          <a class="btn" href="/speaking/static/batch.html?v=20260105_1" target="_blank" rel="noopener">
            <span class="left">
              <span class="title">口语批量处理</span>
            </span>
            <span class="arrow">›</span>
          </a>
        </div>
      </article>

      <article class="card writing">
        <div class="card-head">
          <div class="name">
            <h2>Writing</h2>
          </div>
        </div>
        <div class="card-body">
          <a class="btn" href="/writing/" target="_blank" rel="noopener">
            <span class="left">
              <span class="title">写作精准批改</span>
            </span>
            <span class="arrow">›</span>
          </a>
        </div>
      </article>
    </section>
  </div>

  <script>
    (function(){
      const imgs = Array.from(document.querySelectorAll('#bannerViewport img'));
      const dots = Array.from(document.querySelectorAll('.dot'));
      if (!imgs.length || !dots.length) return;

      let idx = 0;
      let timer = null;
      const INTERVAL = 4500;

      function show(i){
        idx = (i + imgs.length) % imgs.length;
        imgs.forEach((img, k) => img.classList.toggle('active', k === idx));
        dots.forEach((d, k) => d.classList.toggle('active', k === idx));
      }

      function restart(){
        if (timer) clearInterval(timer);
        timer = setInterval(() => show(idx + 1), INTERVAL);
      }

      dots.forEach((d, i) => {
        d.addEventListener('click', () => {
          show(i);
          restart();
        });
      });

      // 如果某张图 404：隐藏该图并继续轮播剩余图片
      imgs.forEach((img) => {
        img.addEventListener('error', () => {
          img.style.display = 'none';
        });
      });

      restart();
    })();
  </script>
</body>
</html>
